name: Build LaTeX PDFs
on:
  push:
    branches: [asi-revision-courses-de-fond]
    paths:
      - 'ASI/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asi-revision-courses-de-fond
      - name: Installer LaTeX et les polices
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-french fonts-crosextra-carlito poppler-utils graphviz
      - name: Compiler les PDF
        run: make -C ASI pdf && make -C ASI verify
      - name: Publier les PDF dans le dépôt
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add ASI/dist/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'docs: mettre à jour les PDF compilés [skip ci]'
          git push
      - name: Télécharger les PDF comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: ASI-PDF-revision-et-examen-blanc
          path: ASI/dist/*.pdf